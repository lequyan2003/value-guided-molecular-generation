seed: 42
device: "cuda"            # scripts fall back to cpu when cuda is unavailable
output_dir: "./results"

# unguided | best_of_n | svdd_pm | svdd_value | random_select
method: "svdd_value"

model:
  name: "digress"                          # digress | toy (toy = smoke-test stand-in, not a generator)
  digress_checkpoint: "digress_qm9_seed0.ckpt"  # trained by us at Stage 1-2 (official checkpoint is gone); path + SHA-256 logged
  toy_num_steps: 4

data:
  reference: "qm9"                         # molecules used for novelty: qm9 (full set) | smoke

svdd:
  num_candidates_m: 10                     # M; sweeps use {1, 5, 10, 20}
  reward_type: "sa"                        # sa | qed  (docking_proxy is a stretch goal)
  value_fn_arch: "mlp"                     # mlp (gnn: planned Nov 14-19, go/no-go Nov 20, dropped if it does not beat the MLP on val MSE)
  selection: "argmax"                      # argmax | softmax
  alpha: 0.1                               # softmax temperature

value_fn:                                  # trained once per (model, reward, arch, seed), then cached
  train_chains: 10000                      # unguided rollouts for training (proposal: 10k)
  val_chains: 1000                         # separate rollouts for model selection (different RNG stream)
  ts_per_chain: 20                         # timesteps sampled per chain
  train_steps: 3000
  batch_size: 256
  lr: 0.001
  hidden_dim: 128
  num_hidden: 2
  eval_every: 100
  diag_t0_molecules: 1000                  # real held-out QM9 molecules (1k val split) for the t=0 check; 0 = off
  diag_sibling_t_fracs: [0.8, 0.5, 0.2]    # H1: noise levels (as t/T) at which sibling ranking is measured
  diag_sibling_parents: 32                 # parents per level (0 = off)
  diag_sibling_completions: 4              # unguided continuations per child that estimate its true value

best_of_n:
  m_values: [5, 10, 20]                    # one pool per seed yields best-of-m for every m and reward

eval:
  num_molecules: 2000                      # N per run (proposal)
  batch_size: 512
  report_rewards: ["sa", "qed"]            # all computed from the same molecules
