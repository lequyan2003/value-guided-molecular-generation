seed: 0
device: cuda
output_dir: ./results/pilot_ep139
method: svdd_pm
model:
  name: digress
  digress_checkpoint: results/digress_qm9/ckpt/early_ep139.ckpt
  toy_num_steps: 4
data:
  reference: qm9
svdd:
  num_candidates_m: 10
  reward_type: sa
  value_fn_arch: mlp
  selection: argmax
  alpha: 0.1
value_fn:
  train_chains: 400
  val_chains: 100
  ts_per_chain: 5
  train_steps: 300
  batch_size: 256
  lr: 0.001
  hidden_dim: 128
  num_hidden: 2
  gnn_hidden_dim: 64
  gnn_layers: 3
  eval_every: 100
  diag_t0_molecules: 100
  diag_sibling_t_fracs:
  - 0.8
  - 0.5
  - 0.2
  diag_sibling_parents: 4
  diag_sibling_completions: 2
best_of_n:
  m_values:
  - 10
eval:
  num_molecules: 128
  batch_size: 128
  report_rewards:
  - sa
  - qed
